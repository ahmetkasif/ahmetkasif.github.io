# Her push ve pull request'te _data dosyalarını denetler.
# Hata varsa Actions sekmesinde kırmızı ✗ görürsün; site yine de GitHub Pages tarafından derlenir,
# bu yüzden yayına almadan önce yeşil olduğundan emin ol.
name: Veri denetimi

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - run: python tools/check.py
