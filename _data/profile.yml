# Tanıtım yazısı: her paragraf listede ayrı bir satırdır ("- " ile başlar). Paragraf eklemek/silmek için satır ekle/sil.
bio:
  - "Assistant Professor in the Department of Computer Engineering at Bursa Technical University and currently a Postdoctoral Researcher in the Department of Computer Engineering at Qatar University."
  - "My research focuses on Artificial Intelligence, Machine Learning, and Deep Learning, with particular interests in lightweight AI, time-series analysis, and intelligent systems."
  - "I enjoy collaborating with interdisciplinary teams, solving real-world industry problems, and mentoring students through research projects that can evolve into high-quality academic publications."
  - "Feel free to connect if you are working in related areas or would like to explore potential research or industry collaborations."
bio_tr:
  - "Bursa Teknik Üniversitesi Bilgisayar Mühendisliği Bölümünde Dr. Öğretim Üyesi olarak görev yapıyorum. Aynı zamanda Katar Üniversitesi Bilgisayar Mühendisliği Bölümünde doktora sonrası araştırmacı olarak çalışmalarımı sürdürüyorum."
  - "Araştırmalarım Yapay Zekâ, Makine Öğrenmesi ve Derin Öğrenme alanlarına odaklanmakta; özellikle hafif yapay zekâ modelleri, zaman serisi analizi ve akıllı sistemler üzerine çalışmaktayım."
  - "Disiplinler arası ekiplerle iş birliği yapmaktan, gerçek dünya ve sanayi problemlerine çözüm geliştirmekten ve öğrencileri nitelikli akademik yayınlara dönüşebilecek araştırma projelerinde yönlendirmekten keyif alıyorum."
  - "Benzer alanlarda çalışıyorsanız veya potansiyel akademik ya da sanayi iş birliklerini değerlendirmek isterseniz iletişime geçebilirsiniz."

